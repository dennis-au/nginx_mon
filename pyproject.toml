[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nginx-mon"
version = "0.4.0"
description = "Real-time Nginx reverse proxy traffic monitor"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Dennis Au"}]
dependencies = ["textual>=0.47,<1.0"]

[project.scripts]
nginx-mon = "nginx_mon.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
