# Include this file from the `http` context, for example under /etc/nginx/conf.d/.
# The `escape=json` option protects quoted request paths and Host headers.
log_format nginx_mon_json escape=json '{'
    '"time":"$time_iso8601",'
    '"scheme":"$scheme",'
    '"host":"$host",'
    '"server_port":"$server_port",'
    '"server_addr":"$server_addr",'
    '"source_addr":"$remote_addr",'
    '"source_port":"$remote_port",'
    '"ssl_protocol":"$ssl_protocol",'
    '"request":"$request",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":"$status",'
    '"upstream_addr":"$upstream_addr",'
    '"request_length":"$request_length",'
    '"bytes_sent":"$bytes_sent",'
    '"upstream_bytes_sent":"$upstream_bytes_sent",'
    '"upstream_bytes_received":"$upstream_bytes_received",'
    '"request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time"'
    '}';

# Test server: replace the upstream and server name for a deployed proxy.
server {
    listen 8080;
    server_name api.lab.test;

    access_log /var/log/nginx/nginx-mon-access.json.log nginx_mon_json;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
